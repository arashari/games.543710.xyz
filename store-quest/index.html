<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Shopkeeper Quest 3D</title>
<meta name="theme-color" content="#161228" />
<link rel="manifest" href="/store-quest/manifest.json" />
<link rel="apple-touch-icon" href="/store-quest/store-quest-icon.svg" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ShopQuest" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #161228; font-family: "Trebuchet MS", system-ui, sans-serif; color: #fff; overscroll-behavior: none; touch-action: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 7px; pointer-events: none;
    background: rgba(12, 10, 24, 0.55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px 12px; border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    min-width: 250px; max-width: 92vw;
  }
  #order { display: flex; gap: 8px; align-items: center; font-size: clamp(16px, 4vw, 26px); flex-wrap: wrap; justify-content: center; }
  .chip { background: rgba(255,255,255,.12); border-radius: 10px; padding: 2px 9px; }
  #patience { width: 100%; height: 8px; background: rgba(255,255,255,.15); border-radius: 6px; overflow: hidden; margin-top: 5px; }
  #patienceBar { height: 100%; width: 100%; background: #4dff88; }
  #orderWrap { display: none; margin-top: 6px; }
  #orderWrap.show { display: block; }
  #stats { font-size: clamp(13px, 3.2vw, 18px); opacity: .92; letter-spacing: .02em; }

  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center;
    font-size: 12px; opacity: .8; pointer-events: none;
    background: rgba(12,10,24,0.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: 6px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); max-width: 92vw;
  }

  #toast {
    position: fixed; top: 32%; left: 50%; transform: translateX(-50%); z-index: 18;
    font-size: 30px; font-weight: 900; color: #ffd24a; text-shadow: 0 2px 0 #0008;
    opacity: 0; transition: opacity .18s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  #flash { position: fixed; inset: 0; background: #ff2b2b; opacity: 0; pointer-events: none; z-index: 15; transition: opacity .12s; }

  #joy {
    position: fixed; left: 18px; bottom: 18px; width: 130px; height: 130px; z-index: 12;
    border-radius: 50%; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.18);
    touch-action: none; display: none; align-items: center; justify-content: center;
  }
  #joyKnob {
    width: 58px; height: 58px; border-radius: 50%; background: rgba(255,210,74,.85);
    box-shadow: 0 4px 14px #0007; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%); pointer-events: none;
  }
  #joyLabel { position: absolute; bottom: -20px; font-size: 10px; letter-spacing: .25em; opacity: .5; }
  #btns { position: fixed; right: 18px; bottom: 18px; z-index: 12; display: none; gap: 14px; align-items: flex-end; }
  body.touch #joy, body.touch #btns { display: flex; }
  .act {
    border-radius: 50%; border: 2px solid rgba(255,255,255,.25); color: #fff;
    font-weight: 800; font-size: 14px; letter-spacing: .05em; touch-action: none; user-select: none;
    display: flex; align-items: center; justify-content: center; -webkit-user-select: none;
  }
  #btnJump { width: 84px; height: 84px; background: rgba(77,255,136,.25); }
  #btnSprint { width: 66px; height: 66px; background: rgba(43,222,238,.22); align-self: flex-end; }

  #crosshair { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); z-index: 14; pointer-events: none; transition: border-color .12s, transform .12s; }
  #crosshair::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255,255,255,.9); }
  #crosshair.aim { border-color: #78ebff; transform: scale(1.3); }
  #prompt { position: fixed; left: 50%; top: calc(50% + 28px); transform: translateX(-50%); z-index: 14; pointer-events: none; background: rgba(20,16,36,.82); border: 1px solid rgba(255,255,255,.22); color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .12s; white-space: nowrap; }
  #prompt.show { opacity: 1; }
  #btnJump.actmode { background: rgba(255,210,74,.4); border-color: rgba(255,210,74,.7); }

  #confetti { position: fixed; inset: 0; z-index: 25; pointer-events: none; overflow: hidden; }
  .conf { position: absolute; top: -24px; border-radius: 2px; opacity: .95; will-change: transform; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(112vh) rotate(720deg); } }

  #overlay {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    background: radial-gradient(circle at 50% 40%, #2d0b4544, #07020fdd);
    backdrop-filter: blur(3px); text-align: center;
  }
  #overlay.show { display: flex; }
  #winEmoji {
    font-size: clamp(90px, 22vw, 180px); line-height: 1;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,.5));
    animation: emojiPop .7s cubic-bezier(.2,1.6,.4,1) both;
  }
  @keyframes emojiPop { 0%{transform:scale(0) rotate(-35deg);} 60%{transform:scale(1.25) rotate(8deg);} 100%{transform:scale(1) rotate(0);} }
  #overlay h1 { font-size: clamp(34px, 8vw, 80px); font-weight: 900;
    background: linear-gradient(180deg,#fff,#ffd24a 60%,#ff3cac);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 24px #ffd24a66); }
  #overlay p { font-size: 16px; opacity: .8; }
  #overlay button {
    margin-top: 6px; font-size: 18px; font-weight: 800; letter-spacing: .08em;
    padding: 12px 28px; border: none; border-radius: 14px; cursor: pointer; color: #1a0033;
    background: linear-gradient(180deg,#fff,#ffd24a 40%,#ff3cac); box-shadow: 0 10px 30px #0008;
  }
  #overlay button:active { transform: scale(.95); }

  @media (max-width: 480px), (max-height: 480px) {
    #hud { top: 0; left: 0; right: 0; transform: none; width: 100%; max-width: 100%; border-radius: 0;
      border-left: none; border-right: none; border-top: none; padding: 0.9vh 10px; gap: 0.7vh; min-width: 0; }
    #order { font-size: clamp(14px, min(4.6vw,5vh), 26px); }
    #stats { width: 100%; display: flex; justify-content: space-around; gap: 6px; font-size: clamp(11px, min(3vw,3vh), 16px); }
    #hint { font-size: clamp(9px, min(2.6vw,2.6vh), 12px); }
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="stats"></div>
    <div id="orderWrap">
      <div id="order"><span id="orderChips"></span></div>
      <div id="patience"><div id="patienceBar"></div></div>
    </div>
  </div>

  <div id="hint">Step into a ring — 🔵 grab · 🟢 serve · 🔴 trash — press <b>JUMP</b> (Space) to act</div>
  <div id="toast"></div>
  <div id="crosshair"></div>
  <div id="prompt"></div>

  <div id="joy"><div id="joyKnob"></div><div id="joyLabel">MOVE</div></div>
  <div id="btns">
    <div id="btnSprint" class="act">SPRINT</div>
    <div id="btnJump" class="act">JUMP</div>
  </div>

  <div id="flash"></div>
  <div id="confetti"></div>

  <div id="overlay">
    <div id="winEmoji">💔</div>
    <h1 id="winTitle">Game Over</h1>
    <p id="winSub">you served every customer</p>
    <button id="replay">Play again</button>
  </div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from "three";

// ---------------------------------------------------------------- config
const GRAVITY = -32, JUMP_V = 13, RUN_SPEED = 11, SPRINT_SPEED = 18;
const MAX_MISTAKES = 3;       // lives
const VAL = { apple: 5, fish: 8, crate: 4 };
const ITEMS = ["apple", "fish", "crate"];
const CARRY_CAP = 3;        // max items the player can carry at once
const ICON = { apple: "🍎", fish: "🐟", crate: "📦" };
const COUNTER = new THREE.Vector3(0, 0, 11);
const ROOM = 16;              // half-size of the shop (walls at ±ROOM)
const BEST_KEY = "shopkeeper_best";
let best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) {}

// ---------------------------------------------------------------- renderer / scene
const app = document.getElementById("app");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161228);
scene.fog = new THREE.Fog(0x161228, 44, 100);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3358, 0.95));
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const sun = new THREE.DirectionalLight(0xfff3d6, 1.1);
sun.position.set(15, 30, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40; sun.shadow.camera.far = 100;
scene.add(sun);
const lamp1 = new THREE.PointLight(0xffe6b0, 0.6, 50); lamp1.position.set(0, 10, 4); scene.add(lamp1);
const lamp2 = new THREE.PointLight(0xffe6b0, 0.5, 50); lamp2.position.set(0, 10, -4); scene.add(lamp2);

let elapsed = 0;

// ---------------------------------------------------------------- indoor decor
const decor = [];
const decorGroup = new THREE.Group(); scene.add(decorGroup);


function makeFloorTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#caa46a"; g.fillRect(0, 0, 128, 128);
  g.fillStyle = "#b8915a";
  for (let y = 0; y < 128; y += 32) for (let x = 0; x < 128; x += 32)
    if (((x + y) / 32) % 2 === 0) g.fillRect(x, y, 32, 32);
  g.strokeStyle = "rgba(90,60,30,0.5)"; g.lineWidth = 2;
  for (let i = 0; i <= 128; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 128); g.moveTo(0, i); g.lineTo(128, i); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(8, 8); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function makeShelfBox(col) {
  return new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.9),
    new THREE.MeshStandardMaterial({ color: col, roughness: .8 }));
}
function makeRing(color) {
  const m = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.6, 1.1, 44), m);
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.06;
  return ring;
}

function makeFish(col) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: col, roughness: .5 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 12), mat);
  body.scale.set(0.7, 0.65, 1.5); g.add(body);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.32, 10), mat);
  tail.position.z = -0.42; tail.rotation.x = -Math.PI / 2; tail.scale.set(1, 0.45, 1); g.add(tail);
  const fin = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.22, 8), mat);
  fin.position.set(0, 0.18, 0.02); fin.scale.set(1, 1, 0.4); g.add(fin);
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0x111111 }));
  eye.position.set(0.13, 0.05, 0.26); g.add(eye);
  return g;
}

function addFishingRod(parent, x, z, lean) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.06, 3.2, 8),
    new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: .8 }));
  pole.position.y = 1.5; pole.rotation.z = lean; pole.castShadow = true; g.add(pole);
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.6, 8),
    new THREE.MeshStandardMaterial({ color: 0x33240f }));
  handle.position.y = 0.3; handle.rotation.z = lean; g.add(handle);
  const tipX = -3.1 * Math.sin(lean), tipY = 3.1 * Math.cos(lean);
  const lineLen = Math.max(0.2, tipY - 0.2);
  const line = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, lineLen, 6),
    new THREE.MeshStandardMaterial({ color: 0xdddddd }));
  line.position.set(tipX, 0.2 + lineLen / 2, 0); g.add(line);
  const bobber = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 10),
    new THREE.MeshStandardMaterial({ color: 0xff3b3b }));
  bobber.position.set(tipX, 0.2, 0); g.add(bobber);
  parent.add(g);
}
function makeWallShelf(x, z, rotY) {
  const g = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.BoxGeometry(5, 2.4, 0.5),
    new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: .9 }));
  frame.position.y = 1.2; frame.castShadow = true; g.add(frame);
  const cols = [0xff7eb6, 0x54e6a0, 0xffe14a, 0x5bc8ff, 0xff5d73];
  for (let r = 0; r < 2; r++) for (let i = 0; i < 4; i++) {
    const b = makeShelfBox(cols[(i + r) % cols.length]);
    b.position.set(-1.7 + i * 1.15, 0.7 + r * 1.1, 0.3); b.castShadow = true; g.add(b);
  }
  g.position.set(x, 0, z); g.rotation.y = rotY; decorGroup.add(g);
}
function makeSignTexture() {
  const c = document.createElement("canvas"); c.width = 1024; c.height = 146;
  const g = c.getContext("2d");
  g.fillStyle = "#ffd24a"; g.fillRect(0, 0, 1024, 146);
  g.strokeStyle = "#15131a"; g.lineWidth = 12; g.strokeRect(6, 6, 1012, 134);
  g.fillStyle = "#15131a"; g.font = "bold 100px Trebuchet MS, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("🛒  THE  MARKET", 512, 73);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function buildDecor() {
  decorGroup.clear(); decor.length = 0;
  // shelves of goods along the back + side walls
  makeWallShelf(0, -ROOM + 0.4, 0);
  const rug = new THREE.Mesh(new THREE.PlaneGeometry(8, 5),
    new THREE.MeshStandardMaterial({ color: 0x7a3b6b, roughness: 1 }));
  rug.rotation.x = -Math.PI / 2; rug.position.set(COUNTER.x, 0.02, COUNTER.z); decorGroup.add(rug);
}

// ---------------------------------------------------------------- world: floor, walls, stations, counter, customer
function makeWall(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color: 0xe9e2d0, roughness: 1 }));
  m.position.set(x, y, z); m.receiveShadow = true; m.castShadow = true; scene.add(m);
  return m;
}
const SOURCES = [];
const carryGroup = new THREE.Group(); scene.add(carryGroup);
const carrySprites = [], carryTex = {};
const CUST_SPEED = 4.5;
const DOOR = new THREE.Vector3(0, 0, ROOM - 0.4);
const WAIT_SPOTS = [
  new THREE.Vector3(-3.5, 0, COUNTER.z + 1.6),
  new THREE.Vector3(0, 0, COUNTER.z + 1.6),
  new THREE.Vector3(3.5, 0, COUNTER.z + 1.6),
];
const TRASH = new THREE.Vector3(6.5, 0, 9);
const spotBusy = [false, false, false];
let customers = [];
const pondFish = [];
let trashRing = null;
const VARIANTS = [
  { body: 0x9ad0ff, hat: 0xff6fae, sy: 1.0,  sxz: 1.0 },
  { body: 0x7be0a0, hat: 0x6f8cff, sy: 1.4,  sxz: 0.85 },
  { body: 0xffd24a, hat: 0xff5d73, sy: 0.95, sxz: 1.35 },
  { body: 0x6f8cff, hat: 0xffd24a, sy: 1.0,  sxz: 1.0 },
  { body: 0xc88cff, hat: 0x4dff88, sy: 1.1,  sxz: 1.05 },
  { body: 0xff9b6b, hat: 0x2bdeee, sy: 0.78, sxz: 0.85 },
];
function totalCarried() { return inv.apple + inv.fish + inv.crate; }
function initCarry() {
  for (const t of ITEMS) {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d");
    g.font = '48px "Apple Color Emoji","Segoe UI Emoji",serif';
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(ICON[t], 32, 36);
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; carryTex[t] = tex;
  }
  for (let i = 0; i < CARRY_CAP; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthTest: false }));
    sp.scale.set(0.7, 0.7, 1); sp.visible = false; sp.renderOrder = 10;
    carryGroup.add(sp); carrySprites.push(sp);
  }
}
function updateCarry() {
  const list = [];
  for (const t of ITEMS) for (let i = 0; i < inv[t]; i++) list.push(t);
  const n = Math.min(list.length, CARRY_CAP);
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);   // look direction (horizontal)
  const rx = -fz, rz = fx;                                 // right vector
  const dist = 0.6, side = 0.55;                          // in front, offset to the right hand
  const cx = player.pos.x + fx * dist + rx * side;
  const cz = player.pos.z + fz * dist + rz * side;
  const baseY = player.pos.y + 0.9, spacing = 0.46;
  for (let i = 0; i < CARRY_CAP; i++) {
    const sp = carrySprites[i];
    if (i < n) {
      sp.visible = true; sp.material.map = carryTex[list[i]]; sp.material.needsUpdate = true;
      sp.position.set(cx, baseY + i * spacing, cz);   // stack upward in the hands
    } else sp.visible = false;
  }
}

function buildWorld() {
  // floor
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM * 2, ROOM * 2),
    new THREE.MeshStandardMaterial({ map: makeFloorTexture(), roughness: .95 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  // walls
  makeWall(ROOM * 2, 12, 0.5, 0, 6, -ROOM);
  // front wall with a doorway in the middle (gap x ∈ [-2.5, 2.5])
  makeWall(13.5, 12, 0.5, -9.25, 6, ROOM);
  makeWall(13.5, 12, 0.5, 9.25, 6, ROOM);
  const woodMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: .9 });
  const postL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 12, 0.8), woodMat); postL.position.set(-2.5, 6, ROOM); scene.add(postL);
  const postR = new THREE.Mesh(new THREE.BoxGeometry(0.5, 12, 0.8), woodMat); postR.position.set(2.5, 6, ROOM); scene.add(postR);
  const lintel = new THREE.Mesh(new THREE.BoxGeometry(5.6, 1.2, 0.8), woodMat); lintel.position.set(0, 11.4, ROOM); scene.add(lintel);
  // open door panel (hinged on the right post, swung into the shop)
  const doorPivot = new THREE.Group(); doorPivot.position.set(2.5, 0, ROOM);
  const panel = new THREE.Mesh(new THREE.BoxGeometry(0.3, 9, 4.6), new THREE.MeshStandardMaterial({ color: 0x8a5a2b, roughness: .9 }));
  panel.position.set(0, 4.5, -2.3); panel.castShadow = true; doorPivot.add(panel);
  doorPivot.rotation.y = -1.2; scene.add(doorPivot);
  makeWall(0.5, 12, ROOM * 2, -ROOM, 6, 0);
  makeWall(0.5, 12, ROOM * 2, ROOM, 6, 0);
  // ceiling light panels
  for (const x of [-8, 0, 8]) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(3, 0.2, 1),
      new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff3d6, emissiveIntensity: .8 }));
    p.position.set(x, 11.5, 0); scene.add(p);
  }
  // back-wall sign
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(14, 2),
    new THREE.MeshBasicMaterial({ map: makeSignTexture() }));
  sign.position.set(0, 9, -ROOM + 0.3); scene.add(sign);

  // ---- station: crate shelf (right) ----
  const shelf = new THREE.Group();
  const sframe = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 1.4),
    new THREE.MeshStandardMaterial({ color: 0x8a5a2b, roughness: .9 }));
  sframe.position.y = 1.5; sframe.castShadow = true; shelf.add(sframe);
  for (let r = 0; r < 2; r++) for (let i = 0; i < 2; i++) {
    const cr = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.0, 1.0),
      new THREE.MeshStandardMaterial({ color: 0xb5793f, roughness: 1 }));
    cr.position.set(-0.7 + i * 1.4, 0.8 + r * 1.1, 0.5); cr.castShadow = true; shelf.add(cr);
  }
  shelf.position.set(13.5, 0, 0); scene.add(shelf);
  const crate = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.1),
    new THREE.MeshStandardMaterial({ color: 0xb5793f, roughness: 1 }));
  crate.position.set(13.5, 0.55, 3); crate.castShadow = true; scene.add(crate);
  SOURCES.push({ type: "crate", pos: new THREE.Vector3(13.5, 0, 3), r: 1.6, cool: 0, cd: 1.0, mesh: crate, pulse: 0 });

}

function focusCustomer() {

}

let actx = null, muted = false;
function ac() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function blip(freq, dur, type = "square", gain = 0.08, when = 0) {
  if (muted) return;
  const c = ac(), t = c.currentTime + when;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur);
}
function pickupSfx(i) { blip(620 + i * 90, 0.12, "triangle", 0.12); }
function deliverSfx() { blip(720, 0.1, "triangle", 0.12); blip(960, 0.12, "triangle", 0.12, 0.08); }
function fanfare() {
  if (muted) return;
  const c = ac(), t0 = c.currentTime;
  [0, 4, 7, 12, 16].forEach((s, i) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = "triangle"; const t = t0 + i * 0.08;
    o.frequency.setValueAtTime(523.25 * Math.pow(2, s / 12), t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.42);
  });
}
function buzz() {
  if (muted) return;
  const c = ac(), t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = "sawtooth"; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.3);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.37);
}
function loseSfx() {
  if (muted) return;
  const c = ac(), t0 = c.currentTime;
  const o1 = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), filt = c.createBiquadFilter();
  filt.type = "lowpass"; filt.frequency.value = 2200; filt.Q.value = 1.2;
  o1.type = o2.type = "sawtooth"; o2.detune.value = 8;
  const lfo = c.createOscillator(), lfoG = c.createGain();
  lfo.frequency.value = 6; lfoG.gain.value = 8; lfo.connect(lfoG); lfoG.connect(o1.detune); lfoG.connect(o2.detune);
  o1.connect(filt); o2.connect(filt); filt.connect(g); g.connect(c.destination);
  const notes = [392.00, 349.23, 329.63];
  let tt = t0;
  notes.forEach((f, i) => {
    const dur = i === notes.length - 1 ? 0.5 : 0.2;
    o1.frequency.setValueAtTime(f, tt); o2.frequency.setValueAtTime(f, tt);
    if (i === notes.length - 1) o1.frequency.exponentialRampToValueAtTime(f * 0.94, tt + dur);
    g.gain.setValueAtTime(0.0001, tt); g.gain.exponentialRampToValueAtTime(0.22, tt + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, tt + dur);
    tt += dur;
  });
  lfo.start(t0); o1.start(t0); o2.start(t0); lfo.stop(tt + 0.05); o1.stop(tt + 0.05); o2.stop(tt + 0.05);
}

function endJoy(e) { if (e.pointerId === joyId) { joyId = null; joyVec = { x: 0, y: 0 }; joyKnob.style.transform = "translate(-50%, -50%)"; } }

function updateJoy(e) {
  const r = joy.getBoundingClientRect(); const max = r.width / 2;
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const len = Math.hypot(dx, dy); if (len > max) { dx = (dx / len) * max; dy = (dy / len) * max; }
  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyVec.x = dx / max; joyVec.y = dy / max;
}

// ---------------------------------------------------------------- game loop
const clock = new THREE.Clock();
const up = new THREE.Vector3(0, 1, 0);

function update(dt) {
  elapsed += dt;
  const forward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw)).normalize();
  const right = new THREE.Vector3().crossVectors(forward, up).normalize();

  const move = new THREE.Vector3();
  if (keys["KeyW"] || keys["ArrowUp"]) move.add(forward);
  if (keys["KeyS"] || keys["ArrowDown"]) move.sub(forward);
  if (keys["KeyD"] || keys["ArrowRight"]) move.add(right);
  if (keys["KeyA"] || keys["ArrowLeft"]) move.sub(right);
  if (Math.hypot(joyVec.x, joyVec.y) > 0.12) { move.addScaledVector(forward, -joyVec.y); move.addScaledVector(right, joyVec.x); }

  const sprint = keys["ShiftLeft"] || keys["ShiftRight"];
  const speed = sprint ? SPRINT_SPEED : RUN_SPEED;
  if (move.lengthSq() > 0) { move.normalize().multiplyScalar(speed); player.vel.x = move.x; player.vel.z = move.z; player.yaw = Math.atan2(move.x, move.z); }
  else { player.vel.x *= 0.8; player.vel.z *= 0.8; }

  // (jump is now handled contextually with ACT, right after aim is computed)

  player.vel.y += GRAVITY * dt; player.pos.addScaledVector(player.vel, dt);
  player.grounded = false;
  if (player.pos.y <= player.radius) { player.pos.y = player.radius; player.vel.y = 0; player.grounded = true; }
  player.pos.x = Math.max(-ROOM + 1, Math.min(ROOM - 1, player.pos.x));
  player.pos.z = Math.max(-ROOM + 1, Math.min(ROOM - 1, player.pos.z));

  player.group.position.copy(player.pos); player.group.rotation.y = player.yaw;

  // sources: pulse decay only (pickup is now aim-based)
  for (const s of SOURCES) {
    if (s.pulse > 0) { s.pulse *= 0.85; if (s.pulse < 0.02) s.pulse = 0; s.mesh.scale.setScalar(1 + s.pulse * 0.14); }
  }

  // spawn customers into free counter spots
  if (!won) {
    nextSpawn -= dt;
    if (nextSpawn <= 0) {
      const idx = spotBusy.findIndex(b => !b);
      if (idx >= 0) { spawnCustomer(idx); nextSpawn = 2.4 + Math.random() * 1.8; }
      else nextSpawn = 0.5;
    }
  }

  // patience ticks for every waiting customer (delivery is ring/proximity-based, on ACT)
  if (!won) {
    for (const c of customers) {
      if (c.state !== "wait" || !c.order.active) continue;
      c.order.patience -= dt;
      if (c.order.patience <= 0) angryLeaveCustomer(c);
    }
  }

  // proximity targeting via glowing ground rings (Roblox-style markers)
  aim = null;
  let bestAim = 1e9;
  for (const s of SOURCES) {
    const d = Math.hypot(player.pos.x - s.pos.x, player.pos.z - s.pos.z);
    if (d < s.r && d < bestAim) { bestAim = d; aim = { type: "source", ref: s, dist: d }; }
  }
  for (const c of customers) {
    if (c.state !== "wait") continue;
    const d = Math.hypot(player.pos.x - c.servePoint.x, player.pos.z - c.servePoint.z);
    if (d < 1.7 && d < bestAim) { bestAim = d; aim = { type: "customer", ref: c, dist: d }; }
  }
  const dT = Math.hypot(player.pos.x - TRASH.x, player.pos.z - TRASH.z);
  if (dT < 1.6 && dT < bestAim) { bestAim = dT; aim = { type: "trash", ref: TRASH, dist: dT }; }

  // primary button (Space / JUMP): act when in a zone, otherwise jump
  if (actCooldown > 0) actCooldown -= dt;
  if (keys["Space"]) {
    if (aim) { if (actCooldown <= 0) { doAct(); actCooldown = 0.22; } }
    else if (player.grounded) { player.vel.y = JUMP_V; player.grounded = false; }
  }

  // crosshair + prompt feedback
  if (aim) {
    crosshairEl.classList.add("aim");
    let txt;
    if (aim.type === "source") { txt = "🫳 Pick up " + ICON[aim.ref.type]; btnJump.textContent = "GRAB"; }
    else if (aim.type === "trash") { txt = totalCarried() > 0 ? "🗑️ Drop items" : "🗑️ (empty)"; btnJump.textContent = "DROP"; }
    else { txt = totalCarried() > 0 ? "🤝 Deliver order" : "🎒 need items!"; btnJump.textContent = "SERVE"; }
    btnJump.classList.add("actmode");
    promptEl.textContent = txt;
    promptEl.classList.add("show");
  } else {
    crosshairEl.classList.remove("aim");
    btnJump.textContent = "JUMP"; btnJump.classList.remove("actmode");
    if (totalCarried() > 0) { promptEl.textContent = "🗑️ go to 🔴 trash to drop"; promptEl.classList.add("show"); }
    else promptEl.classList.remove("show");
  }

  // focus customer = the one you're aiming at (drives the contextual order/patience panel)
  const fc = currentFocus();
  const aimingCust = (aim && aim.type === "customer") ? aim.ref : null;
  const pf = aimingCust ? Math.max(0, aimingCust.order.patience / aimingCust.order.maxPatience) : 0;
  patienceBar.style.width = (pf * 100) + "%";
  patienceBar.style.background = pf > 0.5 ? "#4dff88" : pf > 0.25 ? "#ffd24a" : "#ff5d73";
  if (aimingCust) {
    let oc = "";
    for (const t of ITEMS) {
      const n = aimingCust.order.remaining[t];
      oc += `<span class="chip" ${n ? "" : 'style="opacity:.35"'}>${ICON[t]} ×${n}</span>`;
    }
    orderChipsEl.innerHTML = oc;
    orderWrap.classList.add("show");
  } else {
    orderWrap.classList.remove("show");
  }

  // billboards follow their customers (and redraw live)
  for (const c of customers) {
    c.sprite.position.set(c.group.position.x, 3.3, c.group.position.z);
    const show = c.group.visible && (c.state === "enter" || c.order.active);
    c.sprite.visible = show;
    if (show) drawBillboardFor(c, c === fc);
  }

  // move all customers (enter -> wait -> leave)
  for (const c of [...customers]) {
    c.group.position.y = Math.sin(elapsed * 8 + c.group.id) * 0.05;
    const dx = c.target.x - c.group.position.x, dz = c.target.z - c.group.position.z;
    const d = Math.hypot(dx, dz);
    if (d > 0.12) {
      const step = Math.min(d, CUST_SPEED * dt);
      c.group.position.x += dx / d * step;
      c.group.position.z += dz / d * step;
      c.group.rotation.y = (c.state === "leave") ? 0 : Math.PI;
    } else {
      c.group.position.x = c.target.x; c.group.position.z = c.target.z;
      if (c.state === "enter") { c.state = "wait"; c.order.active = true; blip(520, 0.09, "sine", 0.05); }
      else if (c.state === "leave") { removeCustomer(c); }
    }
  }

  // glowing ground markers (pickup / deliver rings) — Roblox-style
  const ringPulse = 0.7 + 0.3 * Math.sin(elapsed * 3);
  for (const s of SOURCES) if (s.ring) { s.ring.material.opacity = ringPulse; s.ring.position.set(s.pos.x, 0.06, s.pos.z); }
  if (trashRing) { trashRing.material.opacity = ringPulse; trashRing.position.set(TRASH.x, 0.06, TRASH.z); }
  for (const c of customers) {
    if (!c.ring) continue;
    const showRing = c.group.visible && c.state === "wait";
    c.ring.visible = showRing;
    if (showRing) {
      c.ring.position.set(c.servePoint.x, 0.06, c.servePoint.z);
      c.ring.material.opacity = ringPulse;
      const aimed = !!(aim && aim.type === "customer" && aim.ref === c);
      c.ring.material.color.set(aimed ? 0x78ebff : 0x4dff88);
      c.ring.scale.setScalar(aimed ? 1.2 : 1);
    }
  }

  // carried items stacked in the player's hands (first-person)
  updateCarry();
  carryGroup.visible = !won;

  resetCooldown = Math.max(0, resetCooldown - dt);

  // first-person camera: at the player's eye, looking along camYaw/camPitch
  const EYE = 1.6;
  camera.position.set(player.pos.x, player.pos.y + EYE, player.pos.z);
  const lx = -Math.sin(camYaw) * Math.cos(camPitch);
  const ly = Math.sin(camPitch);
  const lz = -Math.cos(camYaw) * Math.cos(camPitch);
  camera.lookAt(player.pos.x + lx * 10, player.pos.y + EYE + ly * 10, player.pos.z + lz * 10);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.033, clock.getDelta());
  update(dt);
  for (const d of decor) {
    if (d.userData.bob !== undefined) { d.userData.bob += dt; d.position.y += Math.sin(d.userData.bob * 1.5) * 0.012; }
  }
  for (const f of pondFish) {
    f.userData.t += dt;
    f.position.x = f.userData.bx + Math.sin(f.userData.t * f.userData.sp) * 0.7;
    f.position.z = f.userData.bz + Math.cos(f.userData.t * f.userData.sp * 0.8) * 0.5;
    f.position.y = f.userData.by + Math.sin(f.userData.t * 3 + f.userData.ph) * 0.03;
    f.rotation.y = f.userData.ry + Math.sin(f.userData.t * f.userData.sp) * 0.6;
  }
  renderer.render(scene, camera);
}

// ---------------------------------------------------------------- game over / replay
const overlay = document.getElementById("overlay");
const winTitle = document.getElementById("winTitle");
const winEmoji = document.getElementById("winEmoji");
const winSub = document.getElementById("winSub");
const confettiBox = document.getElementById("confetti");
const replay = document.getElementById("replay");

function burstConfetti() {
  const colors = ["#ffd24a", "#ff3cac", "#2bdeee", "#4dff88", "#ffffff", "#ff8a3c"];
  for (let i = 0; i < 90; i++) {
    const d = document.createElement("div"); d.className = "conf";
    const s = 7 + Math.random() * 10;
    d.style.left = (Math.random() * 100) + "vw";
    d.style.width = s + "px"; d.style.height = (s * 1.4) + "px";
    d.style.background = colors[(Math.random() * colors.length) | 0];
    d.style.animationDuration = (1.6 + Math.random() * 1.8) + "s";
    d.style.animationDelay = (Math.random() * 0.5) + "s";
    confettiBox.appendChild(d); setTimeout(() => d.remove(), 4200);
  }
}
function gameOver() {
  won = true;
  if (served > best) { best = served; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
  winEmoji.textContent = "💔"; winTitle.textContent = "Game Over";
  winSub.textContent = "Served " + served + "  ·  Best " + best;
  overlay.classList.add("show"); loseSfx();
  const f = document.getElementById("flash"); f.style.background = "#ff2b2b"; f.style.opacity = "0.6";
  setTimeout(() => (f.style.opacity = "0"), 220);
}
function startGame() {
  won = false; resetCooldown = 0; mistakes = 0; coins = 0; served = 0;
  inv = { apple: 0, fish: 0, crate: 0 };
  nextSpawn = 1.6;
  overlay.classList.remove("show"); confettiBox.innerHTML = "";
  buildDecor();
  player.pos.set(0, 0.7, 0); player.vel.set(0, 0, 0); player.group.visible = false;
  camYaw = Math.PI; camPitch = 0.15;  // face the counter / customers on (re)start
  for (const c of [...customers]) removeCustomer(c);
  spotBusy.fill(false);
  updateHUD(); updateCarry();
}
replay.addEventListener("click", startGame);

const isTouch = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || "ontouchstart" in window || navigator.maxTouchPoints > 0;
document.body.classList.toggle("touch", isTouch);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});

buildWorld();
initCarry();
startGame();
animate();
</script>

    });
