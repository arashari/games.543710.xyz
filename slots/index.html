<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0e2a">
<link rel="manifest" href="/slots/manifest.json" />
<link rel="apple-touch-icon" href="/slots/slots-icon.svg" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LuckySlots" />
<title>Lucky Slots</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(circle at 50% -10%, #2a1b4d, #0a0e2a 60%);
    color:#fff; display:flex; flex-direction:column; align-items:center;
    min-height:100%; padding:env(safe-area-inset-top) 12px 12px;
    -webkit-user-select:none; user-select:none; overflow-y:auto;
  }
  #app{width:100%; max-width:460px; display:flex; flex-direction:column; gap:10px; flex:1}
  header{display:flex; justify-content:space-between; align-items:center; margin-top:4px}
  h1{font-size:clamp(18px,6vw,28px); margin:0; letter-spacing:1px; text-shadow:0 2px 0 #0008}
  .bal{background:linear-gradient(#ffd24a,#f0a500); color:#3a2400; font-weight:800;
       padding:7px 13px; border-radius:999px; font-size:14px; box-shadow:0 3px 0 #a86f00; white-space:nowrap}
  #reelWrap{position:relative; border-radius:18px; overflow:hidden;
       box-shadow:0 12px 30px #0009, inset 0 0 0 3px #ffffff22; background:#120a2e; will-change:transform}
  canvas{display:block; width:100%}
  #msg{text-align:center; min-height:22px; font-size:17px; font-weight:800; color:#ffd24a; text-shadow:0 1px 0 #0006}
  #status{text-align:center; font-size:11px; opacity:.7}
  #shop{display:flex; gap:6px}
  .mod{flex:1; font:inherit; font-weight:800; font-size:12px; line-height:1.15; border:0; border-radius:12px;
       padding:8px 4px; color:#fff; cursor:pointer; background:linear-gradient(#3a2a66,#241646);
       box-shadow:0 3px 0 #160d2e; -webkit-tap-highlight-color:transparent; text-align:center}
  .mod span{display:block; font-size:11px; opacity:.8; margin-top:2px}
  .mod.owned{background:linear-gradient(#1f6b3a,#114a26); box-shadow:0 3px 0 #0a2e16}
  .mod.poor{opacity:.45}
  .mod:active{transform:translateY(2px); box-shadow:0 1px 0 #160d2e}
  .controls{display:flex; gap:10px; margin-top:auto}
  button.act{flex:1; font:inherit; font-weight:800; border:0; border-radius:16px; padding:16px;
         color:#fff; cursor:pointer; -webkit-tap-highlight-color:transparent}
  #spin{background:linear-gradient(#ff5fa2,#d6246f); box-shadow:0 5px 0 #8e1448; font-size:19px; letter-spacing:1px}
  #spin:active{transform:translateY(3px); box-shadow:0 2px 0 #8e1448}
  #free{background:linear-gradient(#4be0c0,#1ba98c); box-shadow:0 5px 0 #0d6e5b; flex:0 0 40%}
  footer{text-align:center; font-size:11px; opacity:.5; padding-bottom:env(safe-area-inset-bottom)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍒 LUCKY SLOTS 💎</h1>
    <div class="bal">🪙 <span id="balance">1000</span></div>
  </header>
  <div id="reelWrap"><canvas id="reels"></canvas></div>
  <div id="msg">Hold reels, then SPIN!</div>
  <div id="status"></div>
  <div id="shop">
    <button class="mod" data-mod="wild">🍀 Wild<span>300</span></button>
    <button class="mod" data-mod="mult">✖️ ×2<span>250</span></button>
    <button class="mod" data-mod="diag">◇ Diag<span>200</span></button>
    <button class="mod" data-mod="lucky">🍀 Luck<span>350</span></button>
  </div>
  <div class="controls">
    <button id="free" class="act">＋ FREE</button>
    <button id="spin" class="act">SPIN</button>
  </div>
  <footer>Play money only — no real prizes.</footer>
</div>

<script>
const cv = document.getElementById('reels');
const ctx = cv.getContext('2d');
const SYMS = [
  {e:'🍒', v:5}, {e:'🍋', v:5}, {e:'🔔', v:10}, {e:'⭐', v:20}, {e:'💎', v:50}, {e:'7️⃣', v:40}
];
const CHERRY = 0, WILD = 6, WILD_E = '🍀';
const REELS = 3, ROWS = 3, L = 24;
let balance = 1000, bet = 10;
let spinning = false, flash = 0, shakeAmt = 0;
let winCells = [];
const mods = {wild:false, diag:false, lucky:false};
const COST = {wild:300, mult:250, diag:200, lucky:350};
let multCount = 0, mult = 1, streak = 0;

function randStrip(){ const s=[]; for(let i=0;i<L;i++) s.push(Math.floor(Math.random()*SYMS.length)); return s; }
const reels = [];
for(let i=0;i<REELS;i++) reels.push({strip:randStrip(), offset:Math.floor(Math.random()*L), spinning:false, held:false, start:0, target:0, startTime:0, dur:0, result:0});

let W, H, symH, reelW, dpr;
const reelWrap = document.getElementById('reelWrap');
function resize(){
  dpr = window.devicePixelRatio || 1;
  W = Math.min(440, reelWrap.clientWidth);
  H = Math.round(W * 0.62);
  cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  symH = H/ROWS; reelW = W/REELS;
}
window.addEventListener('resize', resize); resize();

const balEl = document.getElementById('balance');
const msgEl = document.getElementById('msg');
const statusEl = document.getElementById('status');
function updateBal(){ balEl.textContent = balance; updateShop(); }
function updateStatus(){ statusEl.textContent = 'BET '+bet+'  ·  MULT ×'+mult+'  ·  STREAK ×'+(1+streak*0.25).toFixed(2); }

// ---------- audio ----------
let actx;
function audioInit(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }
function blip(freq,dur,type='square',gain=0.08,when=0){
  if(!actx) return;
  const t=actx.currentTime+when, o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur);
}
function reelStopped(){ blip(180,0.12,'sine',0.12); blip(120,0.16,'sine',0.08,0.02); }
function winArp(){ [523,659,784,1047].forEach((f,i)=>blip(f,0.18,'triangle',0.09,i*0.08)); }
function fanfare(){ [523,659,784,1047,1319].forEach((f,i)=>blip(f,0.3,'sawtooth',0.06,i*0.1)); blip(1568,0.5,'triangle',0.08,0.5); }
function nearSound(near){ if(near) blip(300,0.1,'sine',0.05); else blip(200,0.12,'sine',0.04); }
function buySound(){ [659,880].forEach((f,i)=>blip(f,0.12,'triangle',0.08,i*0.06)); }

// ---------- particles ----------
const parts = [];
function burst(x,y,n,big){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=(big?4:2)+Math.random()*(big?6:4);
    parts.push({x,y,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-3, life:1, r:7+Math.random()*7});
  }
}
function updateParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.vy+=0.4; p.x+=p.vx; p.y+=p.vy; p.life-=0.02;
    if(p.life<=0) parts.splice(i,1);
  }
}
function drawParts(){
  ctx.font='20px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const p of parts) ctx.fillText('🪙', p.x, p.y);
}

// ---------- shop / modifiers ----------
function weightedPick(w){ let s=w.reduce((a,b)=>a+b,0), x=Math.random()*s; for(let i=0;i<w.length;i++){ if(x<w[i]) return i; x-=w[i]; } return w.length-1; }
function addWilds(){ reels.forEach(r=>{ for(let n=0;n<2;n++){ r.strip[Math.floor(Math.random()*r.strip.length)] = WILD; } }); }
function luckyReels(){ const w=[3,3,4,5,6,6]; reels.forEach(r=>{ for(let i=0;i<r.strip.length;i++) r.strip[i]=weightedPick(w); }); }
function updateShop(){
  document.querySelectorAll('.mod').forEach(b=>{
    const m=b.dataset.mod;
    const owned=(m!=='mult')&&mods[m];
    const afford=balance>=COST[m];
    b.classList.toggle('owned', owned);
    b.classList.toggle('poor', !owned && !afford);
    const span=b.querySelector('span');
    span.textContent = m==='mult' ? ('×'+mult+(multCount?' ('+multCount+')':'')) : (owned?'OWNED':COST[m]);
  });
}
function buy(m){
  if(balance<COST[m]){ msgEl.textContent='need more coins'; return; }
  if((m!=='mult') && mods[m]) return;
  balance-=COST[m]; updateBal(); audioInit(); buySound();
  if(m==='wild'){ mods.wild=true; addWilds(); }
  else if(m==='diag'){ mods.diag=true; }
  else if(m==='lucky'){ mods.lucky=true; luckyReels(); }
  else if(m==='mult'){ multCount++; mult=Math.pow(2,multCount); }
  msgEl.textContent='bought '+(m==='mult'?('×'+mult):m)+'!';
  updateStatus();
}
document.querySelectorAll('.mod').forEach(b=>b.addEventListener('click',()=>buy(b.dataset.mod)));

// ---------- hold reels ----------
function toggleHold(r){
  if(spinning) return;
  const heldCount=reels.filter(x=>x.held).length;
  if(reels[r].held){ reels[r].held=false; }
  else { if(heldCount>=2){ msgEl.textContent='max 2 holds'; return; } reels[r].held=true; }
}
cv.addEventListener('pointerdown', e=>{
  if(spinning) return;
  const rect=cv.getBoundingClientRect();
  const r=Math.floor((e.clientX-rect.left)/(rect.width/REELS));
  if(r>=0 && r<REELS) toggleHold(r);
});

// ---------- spin / logic ----------
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function startSpin(){
  if(spinning) return;
  if(balance < bet){ balance += 500; updateBal(); msgEl.textContent='free coins! 🪙'; return; }
  balance -= bet; updateBal();
  audioInit();
  spinning = true; flash = 0; winCells = [];
  msgEl.textContent = '';
  reels.forEach((r,i)=>{
    if(r.held){ r.spinning=false; return; }
    r.spinning = true;
    r.result = Math.floor(Math.random()*SYMS.length);
    const extra = 3 + i;
    r.target = Math.ceil(r.offset) + extra*L + 2;
    r.strip[((r.target+1)%L+L)%L] = r.result;
    r.start = r.offset; r.startTime = performance.now(); r.dur = 700 + i*350;
  });
}
function reelRow(r,row){ const T = Math.round(r.offset); return r.strip[((T+row)%L+L)%L]; }

function lineValue(cells){
  const nons = cells.filter(x=>x!==WILD);
  if(nons.length===0) return bet*SYMS[4].v;      // all wild -> diamond
  const u = new Set(nons);
  if(u.size>1) return 0;
  return bet*SYMS[[...u][0]].v;
}

function finishSpin(){
  const grid=[[],[],[]];
  for(let row=0; row<3; row++) for(let i=0;i<REELS;i++) grid[row][i]=reelRow(reels[i],row);
  const defs=[
    [[0,0],[1,0],[2,0]], [[0,1],[1,1],[2,1]], [[0,2],[1,2],[2,2]]
  ];
  if(mods.diag){ defs.push([[0,0],[1,1],[2,2]]); defs.push([[0,2],[1,1],[2,0]]); }
  let base=0; winCells=[];
  defs.forEach(def=>{
    const v=lineValue(def.map(([r,row])=>grid[row][r]));
    if(v>0){ base+=v; def.forEach(([r,row])=>winCells.push({r,row})); }
  });
  const c=grid[1];
  if(c.filter(x=>x===CHERRY||x===WILD).length>=2) base+=bet*2;

  if(base>0){
    streak++;
    const total=Math.floor(base*mult*(1+streak*0.25));
    balance+=total; updateBal();
    msgEl.textContent='WIN  +'+total+'  🎉';
    const big=total>=bet*20;
    flash=1; shakeAmt=big?14:7;
    burst(W/2, symH*1.5, big?60:28, big);
    if(big){ fanfare(); setTimeout(()=>burst(W/2,H/2,40,true),200); } else winArp();
  } else {
    streak=0;
    const near=(c[0]===c[1]||c[1]===c[2]||c[0]===c[2]);
    msgEl.textContent=near?'so close…':'no win';
    nearSound(near);
  }
  updateStatus();
}

function updateReels(){
  reels.forEach(r=>{
    if(r.spinning){
      const t = Math.min(1,(performance.now()-r.startTime)/r.dur);
      r.offset = r.start + (r.target-r.start)*easeOutCubic(t);
      if(t>=1){ r.offset=r.target; r.spinning=false; reelStopped(); }
    }
  });
  if(spinning && reels.every(r=>!r.spinning)){ spinning=false; finishSpin(); }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<REELS;i++){
    const x=i*reelW, r=reels[i];
    ctx.fillStyle = i%2 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.20)';
    ctx.fillRect(x,0,reelW,H);
    const base=Math.floor(r.offset), frac=r.offset-base;
    for(let row=-1; row<=3; row++){
      const idx=((base+row)%L+L)%L;
      const sym = r.strip[idx]===WILD ? WILD_E : SYMS[r.strip[idx]].e;
      const y=(row-frac)*symH + symH/2;
      ctx.font = Math.floor(symH*0.72)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(sym, x+reelW/2, y);
    }
    if(i>0){ ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(x-1,0,2,H); }
    if(r.held){
      ctx.fillStyle='rgba(255,210,74,0.16)'; ctx.fillRect(x,0,reelW,H);
      ctx.fillStyle='rgba(255,210,74,0.95)'; ctx.font='bold 12px system-ui,sans-serif';
      ctx.fillText('HOLD', x+reelW/2, 13);
    }
  }
  // base center payline
  ctx.strokeStyle='rgba(255,210,74,0.35)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0, symH*1.5); ctx.lineTo(W, symH*1.5); ctx.stroke();
  // winning cells
  winCells.forEach(({r,row})=>{
    const x=r*reelW, yc=symH*(row+0.5);
    ctx.strokeStyle='rgba(120,255,160,0.95)'; ctx.lineWidth=4;
    ctx.strokeRect(x+reelW*0.08, yc-symH*0.42, reelW*0.84, symH*0.84);
  });
  if(flash>0){ ctx.fillStyle='rgba(255,210,74,'+(flash*0.5)+')'; ctx.fillRect(0,0,W,H); flash-=0.04; }
  drawParts();
}

function frame(){
  updateReels(); draw();
  if(shakeAmt>0.3){
    const dx=(Math.random()*2-1)*shakeAmt, dy=(Math.random()*2-1)*shakeAmt;
    reelWrap.style.transform='translate('+dx+'px,'+dy+'px)';
    shakeAmt*=0.85;
  } else reelWrap.style.transform='';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.getElementById('spin').addEventListener('click', startSpin);
document.getElementById('free').addEventListener('click', ()=>{ balance+=500; updateBal(); msgEl.textContent='free coins! 🪙'; audioInit(); });
updateBal(); updateStatus();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/slots/slots-sw.js', { scope: '/slots' }).catch(function () {});
    });
  }
</script>
</body>
</html>
